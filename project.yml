name: Metronome

options:
  bundleIdPrefix: com.example
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

fileGroups:
  - README.md
  - project.yml

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

targets:
  Metronome:
    type: application
    platform: macOS
    sources:
      - path: Metronome
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.Metronome
        PRODUCT_NAME: Metronome
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Metronome
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.music
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
        COMBINE_HIDPI_IMAGES: YES
    entitlements:
      path: Metronome/Metronome.entitlements
      properties:
        com.apple.security.app-sandbox: true

  MetronomeTests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - path: MetronomeTests
    dependencies:
      - target: Metronome
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.MetronomeTests
        GENERATE_INFOPLIST_FILE: YES
        BUNDLE_LOADER: $(TEST_HOST)
        TEST_HOST: $(BUILT_PRODUCTS_DIR)/Metronome.app/Contents/MacOS/Metronome

schemes:
  Metronome:
    build:
      targets:
        Metronome: all
        MetronomeTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      coverageTargets:
        - Metronome
      targets:
        - MetronomeTests
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
